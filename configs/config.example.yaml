# serp-harvester example configuration.
#
# Copy this file, tweak it, and pass -config path/to/your.yaml.

# mode: "mock" runs entirely offline against the bundled fixture HTML in
# internal/parser/testdata — safe to run anywhere, no network calls.
# "live" issues real HTTP requests to live_endpoint and requires passing
# -i-have-reviewed-tos on the command line.
# "provider" calls a third-party SERP data API instead (see provider_* below
# and the "Third-party provider fetcher" section in README.md).
# "tavily" calls Tavily's native search API using TAVILY_API_KEY by default.
# It does not change the SerpApi-compatible "provider" mode above.
# "playwright" renders live_endpoint in headless Chromium and parses the
# rendered HTML; it also requires -i-have-reviewed-tos and an installed
# Chromium (`make playwright-install`). See README.md "Browser mode".
# "hybrid" is live first, falling back to the browser only for pages that
# need JavaScript or a consent wall HTTP couldn't dismiss (never for
# CAPTCHAs). See README.md "Acquisition resilience".
mode: mock

queries:
  - "best noise cancelling headphones 2026"
  - "how does a heat pump work"
  - "golang worker pool pattern"
  - "google ai overview scraping"
  - "web scraping legal considerations"

# queue_backend: "memory" (default) feeds `queries` from an in-memory list.
# "redis" consumes from a Redis Stream via a consumer group instead, so any
# number of harvester processes can share one queue. Run `make redis-up`
# for a local Redis to try this. See README.md "Distributed queue".
queue_backend: memory
redis_addr: "localhost:6379"
redis_stream: "serp-harvester:queries"
redis_group: "harvesters"
redis_consumer: "worker-1" # must be unique per running process
redis_seed_queue: false # true = push `queries` onto the stream before consuming (local demo only)

# Used only when mode: provider. The API key is read from this environment
# variable, never written here, so it's never committed.
provider_base_url: "" # e.g. "https://serpapi.com/search"
provider_api_key_env: "SERPAPI_KEY"
provider_engine: "google"

# Used only when mode: tavily. The API key is read from this environment
# variable, never stored in this file.
tavily_api_key_env: "TAVILY_API_KEY"

# Set to e.g. ":9090" to serve Prometheus metrics at /metrics for the
# duration of the run. Empty disables it.
metrics_addr: ""

# Worker pool sizing. concurrency=8 with rate_per_proxy_rps=1 caps this
# example config's steady-state to ~8 req/s regardless of proxy count,
# deliberately conservative by default. Scaling to 10M+/day (~116 sustained
# req/s) is a matter of concurrency, proxy pool size, and
# rate_per_proxy_rps — not a different architecture.
concurrency: 8
max_retries: 2

rate_per_proxy_rps: 1
rate_burst: 1
# Adaptive per-proxy throttling: a rate limit or block halves that proxy's
# rate (down to rate_min_rps, default rate_per_proxy_rps/10); successes
# recover it gradually. Default true.
adaptive_rate: true
rate_min_rps: 0

# Leave empty to run direct (no proxy). In production this list would be
# populated from a proxy provider and typically hot-reloaded, not hardcoded
# (see proxy.Pool.Reload for the runtime-reconfiguration seam). To override
# this list at runtime with one authenticated proxy, set HARVESTER_PROXY_URL.
# Keep credentials in environment variables, never in this file.
proxies: []
# A proxy cools down after proxy_ban_fails failures in a row, immediately on
# a CAPTCHA / block page, and for exactly Retry-After on a 429. Repeat
# cooldowns double, up to proxy_ban_cooldown_max; a success resets that.
proxy_ban_fails: 3
proxy_ban_cooldown: 30s
proxy_ban_cooldown_max: 10m
# round_robin (default), random, or weighted_success_rate (biases toward
# proxies with better recent health once the pool has history).
proxy_strategy: round_robin
# When every proxy is cooling, a job waits up to this long for one to
# recover before that attempt fails.
max_proxy_wait: 2m

live_endpoint: "https://www.google.com/search"
request_timeout: 10s # for mode: playwright, ~30s: it covers page load, the consent step and browser_wait_selector

# Used only when mode: playwright. Uses the same proxies, rate limits,
# live_endpoint and request_timeout as the other modes.
browser_pool_size: 4 # max open browser sessions (context + page); workers beyond it wait
browser_max_session_uses: 50 # recycle a session, and its cookies, after this many fetches
browser_wait_selector: "" # e.g. "#search": awaited after load; a page without it is still returned and drift-flagged
browser_executable_path: "" # empty = Playwright's headless shell (recommended); a full Chrome makes its own Google background requests
browser_headful: false # true shows a window, for local debugging only
mock_fixture_dir: "internal/parser/testdata"

# "-" means stdout. Set a file path to write JSON-Lines to disk instead.
output_path: "-"
report_interval: 2s
