name: Deal Intelligence pilot offline tests

on:
  push:
    paths:
      - "scripts/deal_intelligence_tavily_pilot.py"
      - "scripts/test_deal_intelligence_tavily_pilot.py"
      - ".github/workflows/deal-intelligence-pilot-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the pilot HTTP dependency
        run: python -m pip install --disable-pip-version-check "httpx>=0.27,<1"
      - name: Run offline regression tests only
        run: python scripts/test_deal_intelligence_tavily_pilot.py
