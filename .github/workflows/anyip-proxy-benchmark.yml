name: anyIP Proxy Benchmark

# Logs and artifacts of a public repository are readable by anyone signed in
# to GitHub. This workflow therefore keeps results out of the log and keeps
# the artifact for one day: download it promptly after each run. For results
# not yet cleared for publication, a private fork or a local run is safer;
# see docs/anyip-benchmark-runbook.md.

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Session behavior"
        required: true
        type: choice
        options:
          - rotating
          - sticky
          - state-targeted
          - sticky-vs-rotating
      proxy_type:
        description: "Network type; account-default keeps the secret's own setting"
        required: true
        default: account-default
        type: choice
        options:
          - account-default
          - residential
          - mobile
      proxy_secret_name:
        description: "GitHub Actions secret containing the proxy URL"
        required: true
        default: HARVESTER_PROXY_URL
        type: string
      expected_states:
        description: "state-targeted only: comma-separated US states, e.g. Texas,New York,District of Columbia"
        required: false
        default: ""
        type: string
      target_url:
        description: "Authorized target. The default measures geo on the target request itself"
        required: true
        default: "https://ipinfo.io/json"
        type: string
      requests:
        description: "Sequential samples per state (or per run when not state-targeted)"
        required: true
        default: "5"
        type: choice
        options:
          - "5"
          - "10"
          - "20"
          - "30"
          - "50"
          - "100"
      retries:
        description: "Retries per sample after a transport error, proxy error, 429 or 5xx"
        required: true
        default: "0"
        type: choice
        options:
          - "0"
          - "1"
          - "2"
          - "3"
      retry_new_session:
        description: "sticky only: retry on a new session ID"
        required: false
        default: false
        type: boolean
      expect_substring:
        description: "Text a response must contain to count as usable; blank treats every 2xx as usable"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out selected branch
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate benchmark inputs and require proxy secret
        env:
          HARVESTER_PROXY_URL: ${{ secrets[inputs.proxy_secret_name] }}
          PROFILE: ${{ inputs.profile }}
          EXPECTED_STATES: ${{ inputs.expected_states }}
          RETRY_NEW_SESSION: ${{ inputs.retry_new_session }}
        run: |
          if [ -z "$HARVESTER_PROXY_URL" ]; then
            echo "The selected GitHub Actions secret is missing or empty."
            exit 1
          fi
          if [ "$PROFILE" = "state-targeted" ] && [ -z "$EXPECTED_STATES" ]; then
            echo "expected_states is required for state-targeted trials."
            exit 1
          fi
          if [ "$RETRY_NEW_SESSION" = "true" ] && [ "$PROFILE" != "sticky" ] && [ "$PROFILE" != "sticky-vs-rotating" ]; then
            echo "retry_new_session only applies to the sticky profile."
            exit 1
          fi

      - name: Run static analysis and tests
        run: |
          go vet ./...
          go test ./...

      - name: Run low-volume live proxy benchmark
        env:
          HARVESTER_PROXY_URL: ${{ secrets[inputs.proxy_secret_name] }}
          IPINFO_TOKEN: ${{ secrets.IPINFO_TOKEN }}
          PROFILE: ${{ inputs.profile }}
          PROXY_TYPE: ${{ inputs.proxy_type }}
          EXPECTED_STATES: ${{ inputs.expected_states }}
          TARGET_URL: ${{ inputs.target_url }}
          REQUESTS: ${{ inputs.requests }}
          RETRIES: ${{ inputs.retries }}
          RETRY_NEW_SESSION: ${{ inputs.retry_new_session }}
          EXPECT_SUBSTRING: ${{ inputs.expect_substring }}
        run: |
          go build -o "$RUNNER_TEMP/proxybench" ./cmd/proxybench
          out="$RUNNER_TEMP/proxy-benchmark"
          mkdir -p "$out"

          common=(-retries "$RETRIES" -delay 1s -timeout 15s -target-url "$TARGET_URL" -hash-ips)
          if [ "$PROXY_TYPE" != "account-default" ]; then
            common+=(-type "$PROXY_TYPE")
          fi
          if [ -n "$EXPECT_SUBSTRING" ]; then
            common+=(-expect-substring "$EXPECT_SUBSTRING")
          fi
          sticky_args=(-profile sticky -session-id "wh${GITHUB_RUN_ID}")
          if [ "$RETRY_NEW_SESSION" = "true" ]; then
            sticky_args+=(-retry-new-session)
          fi

          # run LABEL SUMMARY_SUFFIX ARGS...: samples append to LABEL.jsonl.
          run() {
            local label="$1" suffix="$2"; shift 2
            "$RUNNER_TEMP/proxybench" "${common[@]}" "$@" \
              -out "$out/$label.jsonl" 2> "$out/$label$suffix.summary.json" || {
                cat "$out/$label$suffix.summary.json"; return 1; }
            # Results stay in the artifact only; the log records that the
            # run happened, not what it found.
            echo "== $label$suffix: $(wc -l < "$out/$label.jsonl") samples written"
          }

          case "$PROFILE" in
            state-targeted)
              IFS=',' read -ra states <<< "$EXPECTED_STATES"
              for state in "${states[@]}"; do
                state="$(echo "$state" | xargs)"
                [ -n "$state" ] || continue
                run "state-$(echo "$state" | tr 'A-Z ' 'a-z_')" "" \
                  -profile state-targeted -requests "$REQUESTS" -expected-state "$state"
              done
              ;;
            sticky-vs-rotating)
              # Alternate the two arms in four blocks on the same runner, so
              # time of day and runner location affect both equally. The
              # sticky arm keeps one session name across its blocks.
              block=$(( REQUESTS / 4 ))
              for b in 1 2 3 4; do
                run rotating ".b$b" -profile rotating -requests "$block"
                run sticky ".b$b" "${sticky_args[@]}" -requests "$block"
              done
              ;;
            sticky)
              run sticky "" "${sticky_args[@]}" -requests "$REQUESTS"
              ;;
            *)
              run "$PROFILE" "" -profile "$PROFILE" -requests "$REQUESTS"
              ;;
          esac

          # Where the runner itself is, for reading latency; GitHub's address,
          # not a proxy exit, and only city, region and network are kept.
          curl -sS --max-time 10 "https://ipinfo.io/json?token=${IPINFO_TOKEN}" \
            | jq -c '{city, region, country, org}' > "$out/runner.json" || true

      - name: Upload summaries and IP-hashed samples
        uses: actions/upload-artifact@v4
        with:
          name: proxy-benchmark-${{ inputs.profile }}-${{ inputs.proxy_type }}-${{ github.run_id }}
          path: ${{ runner.temp }}/proxy-benchmark/
          if-no-files-found: error
          retention-days: 1
