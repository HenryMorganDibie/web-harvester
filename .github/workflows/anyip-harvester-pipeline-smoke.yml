name: anyIP Harvester Pipeline Smoke Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pipeline-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Require proxy secret
        env:
          HARVESTER_PROXY_URL: ${{ secrets.HARVESTER_PROXY_URL }}
        run: |
          if [ -z "$HARVESTER_PROXY_URL" ]; then
            echo "Repository secret HARVESTER_PROXY_URL is missing."
            exit 1
          fi

      - name: Run unit tests
        run: go test ./...

      - name: Run one live job through the full pipeline
        env:
          HARVESTER_PROXY_URL: ${{ secrets.HARVESTER_PROXY_URL }}
        run: |
          cat > "$RUNNER_TEMP/harvester-smoke.yaml" <<'YAML'
          mode: live
          queries:
            - "web harvester proxy pipeline smoke test 1"
            - "web harvester proxy pipeline smoke test 2"
            - "web harvester proxy pipeline smoke test 3"
            - "web harvester proxy pipeline smoke test 4"
            - "web harvester proxy pipeline smoke test 5"
          queue_backend: memory
          concurrency: 1
          max_retries: 0
          rate_per_proxy_rps: 0.2
          rate_burst: 1
          adaptive_rate: false
          live_endpoint: "https://httpbin.org/html"
          request_timeout: 15s
          output_path: "-"
          report_interval: 1s
          YAML

          go run ./cmd/harvester \
            -config "$RUNNER_TEMP/harvester-smoke.yaml" \
            -mode live \
            -queries "web harvester proxy pipeline smoke test 1,web harvester proxy pipeline smoke test 2,web harvester proxy pipeline smoke test 3,web harvester proxy pipeline smoke test 4,web harvester proxy pipeline smoke test 5" \
            -i-have-reviewed-tos \
            > "$RUNNER_TEMP/harvester-results.jsonl"

          if [ ! -s "$RUNNER_TEMP/harvester-results.jsonl" ]; then
            echo "Pipeline completed without emitting a result record."
            exit 1
          fi

          # Emit only validation diagnostics, never result bodies or proxy identifiers.
          jq -e -s '
            def valid:
              (.query | (type == "string" and length > 0)) and
              (.fetched_at | (type == "string" and length > 0)) and
              (.latency_ms | (type == "number" and . >= 0)) and
              (.proxy_used | (type == "string" and length > 0 and (contains("@") | not))) and
              ((.organic // []) | type == "array") and
              (.calibration.missing_blocks | (type == "array" and index("organic_results") != null)) and
              (.raw_body | (type == "string" and length > 0));
            if length != 5 then
              error("expected 5 JSONL records; got \(length)")
            elif all(.[]; valid) then
              true
            else
              "Validation diagnostics (values omitted):",
              (to_entries[] |
                {
                  record: (.key + 1),
                  query_present: ((.value.query | type == "string") and (.value.query | length > 0)),
                  fetched_at_type: (.value.fetched_at | type),
                  latency_ms_type: (.value.latency_ms | type),
                  proxy_used_present: ((.value.proxy_used | type == "string") and (.value.proxy_used | length > 0)),
                  proxy_used_contains_at: ((.value.proxy_used // "") | contains("@")),
                  organic_type: (.value.organic | type),
                  calibration_missing_blocks_type: (.value.calibration.missing_blocks | type),
                  expected_calibration_flag: ((.value.calibration.missing_blocks // []) | (type == "array" and index("organic_results") != null)),
                  raw_body_type: (.value.raw_body | type),
                  raw_body_nonempty: ((.value.raw_body | type == "string") and (.value.raw_body | length > 0))
                }),
              error("one or more result records failed schema validation")
            end
          ' "$RUNNER_TEMP/harvester-results.jsonl"

          echo "Pipeline smoke test validated 5 JSONL records, metadata, calibration flags, raw-body capture, and credential-free proxy identifiers."
          echo "Result bodies and proxy credentials are not printed or uploaded."
