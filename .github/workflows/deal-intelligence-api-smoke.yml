name: Deal Intelligence API read-only smoke check

on:
  push:
    paths:
      - "scripts/deal_intelligence_tavily_pilot.py"
      - "scripts/check_deal_intelligence_api.py"
      - ".github/workflows/deal-intelligence-api-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install HTTP client
        run: python -m pip install --disable-pip-version-check "httpx>=0.27,<1"
      - name: Validate complete read-only production snapshot
        env:
          DEAL_INTEL_API_BASE_URL: https://deal-intelligence-api-henry-dibie-s-projects.vercel.app
        run: python scripts/check_deal_intelligence_api.py
