name: anyIP Proxy and Search Diagnostic

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/anyip-proxy-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Test proxy connectivity and one search request
        env:
          HARVESTER_PROXY_URL: ${{ secrets.HARVESTER_PROXY_URL }}
        shell: bash
        run: |
          set +x
          python3 <<'PY'
          import json
          import os
          import re
          import time
          from datetime import datetime, timezone
          from urllib.error import HTTPError, URLError
          from urllib.parse import quote_plus
          from urllib.request import ProxyHandler, Request, build_opener

          proxy = os.environ.get("HARVESTER_PROXY_URL", "").strip()
          report = {
              "diagnostic": "anyIP proxy connectivity and single-search check",
              "created_at_utc": datetime.now(timezone.utc).isoformat(),
              "proxy_configured": bool(proxy),
              "proxy_connectivity": {"status": "not_run"},
              "search_request": {"status": "not_run"},
              "interpretation": [],
              "safety_note": "No proxy URL, IP address, credentials, or response body is recorded.",
          }
          out = os.environ.get("RUNNER_TEMP", ".")
          report_path = os.path.join(out, "anyip-proxy-diagnostic.json")

          if not proxy:
              report["proxy_connectivity"] = {"status": "failed", "reason": "HARVESTER_PROXY_URL secret is missing"}
              report["search_request"] = {"status": "not_run", "reason": "Proxy configuration is required"}
              report["interpretation"].append("Configure the repository secret before running this diagnostic.")
          else:
              opener = build_opener(ProxyHandler({"http": proxy, "https": proxy}))
              try:
                  start = time.monotonic()
                  req = Request("https://api.ipify.org", headers={"User-Agent": "WebHarvester-Diagnostic/1.0"})
                  with opener.open(req, timeout=20) as response:
                      body = response.read(128).decode("ascii", "replace").strip()
                      elapsed = round((time.monotonic() - start) * 1000)
                      valid_ip = bool(re.fullmatch(r"(?:\d{1,3}\.){3}\d{1,3}|[0-9a-fA-F:]{3,}", body))
                      report["proxy_connectivity"] = {
                          "status": "passed" if response.status == 200 and valid_ip else "failed",
                          "http_status": response.status,
                          "latency_ms": elapsed,
                          "valid_ip_response": valid_ip,
                      }
              except HTTPError as exc:
                  report["proxy_connectivity"] = {"status": "failed", "http_status": exc.code, "reason": "IP-check endpoint returned an HTTP error"}
              except Exception as exc:
                  # Keep the exception category only; it can contain URLs or proxy details.
                  report["proxy_connectivity"] = {"status": "failed", "error_type": type(exc).__name__}

              if report["proxy_connectivity"]["status"] != "passed":
                  report["search_request"] = {"status": "not_run", "reason": "Proxy connectivity check failed"}
                  report["interpretation"].append("The proxy path did not pass a neutral connectivity check; fix this before a search benchmark.")
              else:
                  query = "Python official documentation"
                  url = "https://www.google.com/search?q=" + quote_plus(query)
                  try:
                      start = time.monotonic()
                      req = Request(url, headers={
                          "User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36",
                          "Accept": "text/html,application/xhtml+xml",
                          "Accept-Language": "en-US,en;q=0.8",
                      })
                      with opener.open(req, timeout=20) as response:
                          raw_body = response.read(1_500_000)
                          body = raw_body.decode("utf-8", "replace")
                          elapsed = round((time.monotonic() - start) * 1000)
                          lower = body.lower()
                          blocked_terms = ("unusual traffic", "our systems have detected", "recaptcha", "automated queries", "detected unusual traffic")
                          consent_terms = ("before you continue to google", "consent.google.com", "consent form")
                          is_blocked = any(term in lower for term in blocked_terms)
                          is_consent = any(term in lower for term in consent_terms)
                          has_search_shell = 'id="search"' in lower or "id='search'" in lower
                          # Record limited HTML structure, never the raw response.
                          from html.parser import HTMLParser
                          from urllib.parse import parse_qs, urlsplit

                          class SafePageInspector(HTMLParser):
                              def __init__(self):
                                  super().__init__(convert_charrefs=True)
                                  self.title_depth = 0
                                  self.anchor_depth = 0
                                  self.title_parts = []
                                  self.anchor_parts = []
                                  self.anchors = []
                                  self.h1_depth = 0
                                  self.h1_parts = []
                                  self.headings = []
                                  self.form_actions = []
                                  self.meta_robots = []

                              def handle_starttag(self, tag, attrs):
                                  attrs = dict(attrs)
                                  if tag == "title":
                                      self.title_depth += 1
                                  if tag == "a":
                                      self.anchor_depth += 1
                                      self.anchor_parts = []
                                      self.anchor_href = attrs.get("href", "")
                                  if tag == "h1":
                                      self.h1_depth += 1
                                      self.h1_parts = []
                                  if tag == "form" and attrs.get("action"):
                                      action = urlsplit(attrs["action"])
                                      self.form_actions.append((action.netloc + action.path)[:160])
                                  if tag == "meta" and attrs.get("name", "").lower() in ("robots", "googlebot"):
                                      self.meta_robots.append((attrs.get("name", "") + "=" + attrs.get("content", ""))[:160])

                              def handle_endtag(self, tag):
                                  if tag == "title" and self.title_depth:
                                      self.title_depth -= 1
                                  if tag == "a" and self.anchor_depth:
                                      self.anchor_depth -= 1
                                      self.anchors.append((getattr(self, "anchor_href", ""), " ".join(self.anchor_parts)))
                                  if tag == "h1" and self.h1_depth:
                                      self.h1_depth -= 1
                                      heading = " ".join(self.h1_parts).strip()
                                      if heading:
                                          self.headings.append(heading[:120])

                              def handle_data(self, data):
                                  if self.title_depth:
                                      self.title_parts.append(data)
                                  if self.anchor_depth:
                                      self.anchor_parts.append(data.strip())
                                  if self.h1_depth:
                                      self.h1_parts.append(data.strip())

                          inspector = SafePageInspector()
                          inspector.feed(body)
                          page_title = re.sub(r"\s+", " ", " ".join(inspector.title_parts)).strip()[:180] or None

                          def safe_external_destination(href):
                              if not href:
                                  return None
                              parsed = urlsplit(href)
                              if parsed.path == "/url" and parsed.netloc.endswith("google.com"):
                                  params = parse_qs(parsed.query)
                                  href = (params.get("q") or params.get("url") or [""])[0]
                                  parsed = urlsplit(href)
                              elif href.startswith("/url?"):
                                  params = parse_qs(parsed.query)
                                  href = (params.get("q") or params.get("url") or [""])[0]
                                  parsed = urlsplit(href)
                              if parsed.scheme not in ("http", "https") or not parsed.netloc:
                                  return None
                              host = parsed.netloc.lower()
                              if host == "google.com" or host.endswith(".google.com") or host.endswith(".googleusercontent.com"):
                                  return None
                              return (host + parsed.path[:100])[:180]

                          external_links = []
                          seen_destinations = set()
                          for href, anchor_text in inspector.anchors:
                              destination = safe_external_destination(href)
                              label = re.sub(r"\s+", " ", anchor_text).strip()[:100]
                              if destination and label and destination not in seen_destinations:
                                  seen_destinations.add(destination)
                                  external_links.append({"text": label, "destination_without_query": destination})
                              if len(external_links) >= 12:
                                  break

                          has_result = bool(re.search(r"""class=["'][^"']*(?:MjjYud|g)[^"']*["']""", body))
                          parsed_organic_like = has_search_shell and has_result and not is_blocked and not is_consent
                          # Keep only URL origin/path; do not persist query parameters.
                          final = urlsplit(response.geturl())
                          safe_final_url = f"{final.scheme}://{final.netloc}{final.path[:160]}"
                          html_without_scripts = re.sub(r"(?is)<(script|style)\b[^>]*>.*?</\1\s*>", " ", body)
                          visible_text = re.sub(r"(?s)<[^>]+>", " ", html_without_scripts)
                          visible_text = re.sub(r"\s+", " ", visible_text).strip()
                          import html as html_lib
                          visible_text = html_lib.unescape(visible_text)[:240]
                          tag_counts = {
                              tag: len(re.findall(r"<\s*" + tag + r"\b", body, re.IGNORECASE))
                              for tag in ("html", "body", "a", "div", "script", "form", "iframe", "h1")
                          }
                          signature_terms = (
                              "enablejs", "enable javascript", "unusual traffic", "automated queries",
                              "captcha", "consent", "before you continue", "python.org",
                              "sorry/index", "our systems have detected"
                          )
                          signature_presence = {term: term in lower for term in signature_terms}
                          report["search_request"] = {
                              "status": "passed" if response.status == 200 and parsed_organic_like else ("blocked_or_challenge" if is_blocked else ("consent_page" if is_consent else "no_usable_results")),
                              "http_status": response.status,
                              "latency_ms": elapsed,
                              "final_url_without_query": safe_final_url,
                              "content_type": response.headers.get("Content-Type", "").split(";")[0][:100] or None,
                              "bytes_inspected": len(raw_body),
                              "page_title": page_title,
                              "visible_text_excerpt": visible_text,
                              "html_tag_counts": tag_counts,
                              "diagnostic_signature_presence": signature_presence,
                              "h1_headings": inspector.headings[:5],
                              "form_action_paths": inspector.form_actions[:5],
                              "robots_meta": inspector.meta_robots[:5],
                              "external_link_count_sampled": len(external_links),
                              "external_link_samples": external_links,
                              "search_page_signature": has_search_shell,
                              "result_markup_signature": has_result,
                              "block_or_challenge_signature": is_blocked,
                              "consent_page_signature": is_consent,
                              "usable_result_markup_detected": parsed_organic_like,
                          }
                  except HTTPError as exc:
                      report["search_request"] = {"status": "http_error", "http_status": exc.code}
                  except Exception as exc:
                      report["search_request"] = {"status": "request_error", "error_type": type(exc).__name__}

                  s = report["search_request"]["status"]
                  if s == "passed":
                      report["interpretation"].append("The proxy works and this one search response contains result-like markup. Run the full benchmark only after reviewing the result.")
                  elif s == "blocked_or_challenge":
                      report["interpretation"].append("The proxy connection works, but Google returned a block/challenge page. Stop here; do not retry the 50-query run against the same response path.")
                  else:
                      report["interpretation"].append("The proxy connection works, but the single search request did not yield confirmed usable result markup. This does not establish a working search provider.")
          with open(report_path, "w", encoding="utf-8") as f:
              json.dump(report, f, indent=2)
              f.write("\n")
          print("Diagnostic report written. Proxy URL, IP address, credentials, and response body were not logged.")
          print("Proxy connectivity:", report["proxy_connectivity"]["status"])
          print("Single-search outcome:", report["search_request"]["status"])
          PY

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install headless Chromium for the hybrid smoke test
        run: sh scripts/install-playwright.sh --with-deps

      - name: Test one query through Web Harvester hybrid mode
        env:
          HARVESTER_PROXY_URL: ${{ secrets.HARVESTER_PROXY_URL }}
        shell: bash
        run: |
          set +x
          set -euo pipefail
          out="$RUNNER_TEMP/anyip-diagnostic"
          mkdir -p "$out"
          python3 - "$out" <<'PY'
          import json, os, sys
          out = sys.argv[1]
          config = {
            "mode": "hybrid",
            "queries": ["Python official documentation"],
            "queue_backend": "memory",
            "concurrency": 1,
            "max_retries": 0,
            "rate_per_proxy_rps": 0.2,
            "rate_burst": 1,
            "adaptive_rate": False,
            "proxies": [],
            "live_endpoint": "https://www.google.com/search",
            "request_timeout": "30s",
            "browser_pool_size": 1,
            "browser_max_session_uses": 1,
            "output_path": os.path.join(out, "hybrid-results.jsonl"),
            "report_interval": "1s",
          }
          with open(os.path.join(out, "hybrid-config.json"), "w", encoding="utf-8") as f:
            json.dump(config, f)
          PY
          go build -o "$out/harvester" ./cmd/harvester
          set +e
          "$out/harvester" -config "$out/hybrid-config.json" -mode hybrid -i-have-reviewed-tos > "$out/stdout.log" 2> "$out/stderr.log"
          run_exit=$?
          set -e
          python3 - "$out" "$run_exit" <<'PY'
          import json, os, re, sys
          out, exit_code = sys.argv[1], int(sys.argv[2])
          results_path = os.path.join(out, "hybrid-results.jsonl")
          records = []
          try:
            with open(results_path, encoding="utf-8") as f:
              records = [json.loads(line) for line in f if line.strip()]
          except OSError:
            pass
          organic_count = sum(len(r.get("organic") or []) for r in records)
          latencies = [r.get("latency_ms") for r in records if isinstance(r.get("latency_ms"), (int, float))]
          try:
            logs = open(os.path.join(out, "stderr.log"), encoding="utf-8", errors="replace").read().lower()
          except OSError:
            logs = ""
          if records and organic_count:
            status, reason = "passed", "usable_organic_results"
          elif "captcha" in logs or "challenge" in logs:
            status, reason = "blocked", "captcha_or_challenge_detected"
          elif "interstitial" in logs or "javascript" in logs:
            status, reason = "no_results", "javascript_interstitial_or_browser_fallback_failed"
          elif "consent" in logs:
            status, reason = "no_results", "consent_wall"
          elif "cooldown" in logs:
            status, reason = "no_results", "proxy_cooldown"
          elif "timeout" in logs or "deadline exceeded" in logs:
            status, reason = "no_results", "timeout"
          elif "request failed" in logs or "unexpected eof" in logs:
            status, reason = "no_results", "network_request_failed"
          else:
            status, reason = "no_results", "no_successful_parsed_record"
          report = {
            "diagnostic": "single-query Web Harvester hybrid-mode smoke test",
            "mode": "hybrid",
            "status": status,
            "reason_category": reason,
            "process_exit_code": exit_code,
            "successful_parsed_records": len(records),
            "organic_result_count": organic_count,
            "fetch_latency_ms": latencies[0] if latencies else None,
            "browser_fallback_available_in_runner": True,
            "safety_note": "No proxy URL, credentials, raw response body, or worker logs are included.",
          }
          with open(os.path.join(out, "hybrid-smoke.json"), "w", encoding="utf-8") as f:
            json.dump(report, f, indent=2)
            f.write("\n")
          print("Hybrid smoke status:", status)
          print("Reason category:", reason)
          print("Parsed records:", len(records), "organic results:", organic_count)
          PY

      - name: Upload sanitized diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anyip-proxy-diagnostic
          path: |
            ${{ runner.temp }}/anyip-proxy-diagnostic.json
            ${{ runner.temp }}/anyip-diagnostic/hybrid-smoke.json
          if-no-files-found: warn
          retention-days: 7
